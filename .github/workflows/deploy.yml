name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Deploy only runs if every check above passed, so a failing test never reaches the phone.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a successful publish: if package.json has a new version, create its GitHub Release using
  # that version's section of CHANGELOG.md. Updates that don't bump the version create no release.
  release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "v$V already released, nothing to do."
            exit 0
          fi
          bash scripts/release-notes.sh "$V" > notes.txt
          TITLE=$(head -1 notes.txt | cut -f2)
          tail -n +2 notes.txt > body.md
          {
            echo
            echo '---'
            echo "Build \`${GITHUB_SHA::7}\` · [Open the app](https://panthax666.github.io/monolog/)"
          } >> body.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "$TITLE" --notes-file body.md --latest
